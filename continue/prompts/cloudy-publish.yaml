name: Cloudy publish
version: 0.3.3
schema: v1
prompts:
  - name: cloudy-publish
    description: Publish an HTML page (or the page you just made) to Cloudy and share the link
    prompt: |
      Publish with Cloudy, following the Cloudy rule.

      - File: use the file I name after this command. If I didn't name one, use the HTML page you made or edited most recently in this conversation. If there isn't one, ask which file to publish.
      - Publish it with the Cloudy `publish_page` tool (or `cloudy publish <file>` if the tool isn't available). Make it public only if I asked for a link anyone can open.
      - Reply with the link, and say whether the page is private or public. If it went into an existing space, say which one.
