name: Cloudy comments
version: 0.3.3
schema: v1
prompts:
  - name: cloudy-comments
    description: Read the open Cloudy comments, fix what they ask for, then reply and resolve
    prompt: |
      Work through the open comments on my Cloudy space for this page or repo, following the Cloudy rule.

      1. List the open comments (the `list_comments` tool, or `cloudy comments`) and read every open thread. If I named a space or file after this command, use that one.
      2. For each thread you can address: make the change, then reply with what you changed and resolve it.
      3. If a comment needs a decision from me, or you disagree, reply with your question or reason and leave it open.
      4. Publish the changes so the comments see the new version.
      5. Finish with a short list: resolved, replied and left open, and anything you need from me.
